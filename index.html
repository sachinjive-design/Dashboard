<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Revolution Rise Media — Client Pipeline</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--s1:#131315;--s2:#1a1a1d;--ln:#26262a;--tx:#f2f2f0;--mu:#8b8b92;--ac:#c9ccd3;--gn:#6fcf97;--rd:#eb6f6f;--am:#e5b25d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%}
aside{width:232px;border-right:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{padding:4px 8px 22px;margin-bottom:6px;border-bottom:1px solid var(--ln)}.logo img{display:block;width:100%;max-width:200px;height:auto;filter:drop-shadow(0 0 14px #ffffff14)}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mu);cursor:pointer;transition:.15s}nav a:hover{background:var(--s1);color:var(--tx)}nav a.on{background:var(--s2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--ln)}header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;flex:none}
header input{margin-left:auto;max-width:300px}
main{flex:1;overflow:auto;padding:28px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(4px)}}
input,select,textarea{background:var(--s1);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;width:100%;transition:.15s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
button{background:var(--s2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer;transition:.15s;white-space:nowrap}button:hover{border-color:#44444b}button:active{transform:scale(.97)}
.pr{background:linear-gradient(180deg,#e4e6ea,#b4b8c0);color:#101113;border-color:var(--ac);font-weight:600}.pr:hover{border-color:var(--ac);filter:brightness(1.08)}.dg{color:var(--rd)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:22px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:16px 18px}.card h3{margin:0 0 12px;font-size:12px;color:var(--mu);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.k{font-size:12px;color:var(--mu)}.v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}.v.big{font-size:30px;background:linear-gradient(180deg,#fff,#aeb2ba);-webkit-background-clip:text;background-clip:text;color:transparent}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:22px}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}tr.row{cursor:pointer}tr.row:hover td{background:var(--s2)}.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.tag.gn{color:var(--gn)}.tag.am{color:var(--am)}.tag.rd{color:var(--rd)}.tag.ac{color:var(--ac)}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7d818b,#e6e8ec)}
.tools{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}.tools select{width:auto}.sp{flex:1}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}.lane{flex:0 0 250px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:140px;transition:.15s}.lane.ov{border-color:var(--ac);background:var(--s2)}.lane h4{margin:2px 4px 10px;font-size:12px;color:var(--mu);font-weight:500;display:flex;justify-content:space-between}
.pc{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:11px;margin-bottom:8px;cursor:grab;transition:.15s}.pc:hover{border-color:#44444b}.pc.dr{opacity:.4}.pc b{display:block;margin-bottom:4px}.pc .k{display:flex;justify-content:space-between;gap:6px}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.act:last-child{border:0}.act span{color:var(--mu);font-size:12px;margin-left:auto;white-space:nowrap}
#mo{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}#mo.on{display:flex}
.md{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:92%;overflow:auto;animation:f .2s}.md h2{margin:0 0 16px;font-size:16px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:block;font-size:12px;color:var(--mu)}.fg label input,.fg label select,.fg label textarea{margin-top:4px;color:var(--tx)}.fg .w{grid-column:1/-1}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#ts{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--ln);border-left:2px solid var(--ac);padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.25s;z-index:30;pointer-events:none}#ts.on{opacity:1;transform:none}
.sub{padding:8px 12px;background:var(--s2);border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center}
.sk{height:80px;border-radius:12px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.scr{overflow-x:auto}.ct{fill:var(--mu);font-size:10px}.hp{cursor:pointer;fill:transparent}.hp:hover{fill:#ffffff14}
@media(max-width:760px){#app{flex-direction:column}aside{width:100%;flex-direction:row;padding:10px;border:0;border-bottom:1px solid var(--ln);overflow-x:auto;align-items:center;gap:2px}.logo{padding:0 10px 0 4px;margin:0;border:0;flex:none;width:150px}nav{display:flex}nav a{white-space:nowrap;padding:7px 10px}nav a.on{box-shadow:inset 0 -2px 0 var(--ac)}header{padding:12px 16px;flex-wrap:wrap}header input{max-width:none;flex:1 1 100%;margin:0}main{padding:16px}.fg{grid-template-columns:1fr}.lane{flex-basis:78vw}}
</style></head><body>

<div class="col"><header><h1 id="ttl"></h1><input id="q" placeholder="Search clients & prospects…" aria-label="Search"><button class="pr" onclick="addClient()">+ Client</button><button onclick="addProspect()">+ Prospect</button></header><main id="main"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main></div></div>
<div id="mo"></div><div id="ts"></div>
<script>
const CATS=['Social Media Marketing','Videography & Content Production','Consulting'],BILL=['Monthly','Weekly','Once-off','Custom'],ST=['New Lead','Contacted','Meeting Scheduled','Proposal Sent','Negotiation','Won — Ready to Onboard','Lost'];
const PAGES=[['overview','Overview'],['clients','Current Clients'],['prospects','Potential Clients'],['shoot','Shoot & Content'],['mkt','Marketing & Ads'],['cons','Consulting'],['services','Services'],['revenue','Revenue'],['monthly','Monthly Revenue'],['settings','Settings']];
let S=null,ref=null,page='overview',q='',openId=null,exp={},cf='',cs='name',rc='',rb='';
const $=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const CUR={ZAR:'R',USD:'$',EUR:'€',GBP:'£',AUD:'A$',NGN:'₦',KES:'KSh ',BWP:'P',AED:'AED '};const sym=()=>CUR[(S&&S.settings&&S.settings.cur)||'ZAR']||'R';const R=n=>sym()+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('ts');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)};
function commit(msg,note){if(msg)S.activity.unshift({t:msg,d:new Date().toISOString()});S.activity=S.activity.slice(0,150);draw();ref.set(JSON.parse(JSON.stringify(S))).then(()=>note&&toast(note)).catch(()=>toast('Save failed — check your connection'))}
// ---- calculations
const mrrOf=a=>a.price==null||a.status!=='Active'?0:a.billing==='Monthly'?a.price:a.billing==='Weekly'?a.price*52/12:0;
const onceOf=a=>a.price==null||a.status!=='Active'||a.billing!=='Once-off'?0:a.price;
const live=()=>S.clients.filter(c=>c.status==='Active');
const ags=()=>live().flatMap(c=>c.agreements.map(a=>({...a,cn:c.name,cid:c.id})));
const open=()=>S.prospects.filter(p=>p.stage!=='Lost'&&p.stage!=='Won — Ready to Onboard'||p.stage==='Won — Ready to Onboard');
const openP=()=>S.prospects.filter(p=>p.stage!=='Lost');
const days=a=>a.end?Math.round((new Date(a.end)-new Date(today()))/864e5):null;
const exState=a=>{if(a.status!=='Active')return['Inactive',''];const d=days(a);return d==null?['No end date','']:d<0?['Expired','rd']:d<=60?['Expiring · '+d+'d','am']:['Active','gn']};
// ---- modal forms
function form(title,fields,vals,onSave,extra){const m=$('mo');m.innerHTML=`<div class="md"><h2>${esc(title)}</h2>${extra||''}<div class="fg">${fields.map(f=>`<label class="${f.w?'w':''}">${esc(f.l.replace('(R)','('+sym().trim()+')'))}${f.t==='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option${o===vals[f.k]?' selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t==='area'?`<textarea id="f_${f.k}" rows="3">${esc(vals[f.k])}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}"${f.t==='number'?' step="0.01" min="0" placeholder="Not provided"':''} value="${esc(vals[f.k])}">`}</label>`).join('')}</div><div class="ft"><button onclick="closeM()">Cancel</button><button class="pr" id="sv">Save</button></div></div>`;m.classList.add('on');
$('sv').onclick=()=>{const o={};for(const f of fields){let v=$('f_'+f.k).value.trim();if(f.t==='number')v=v===''?null:parseFloat(v);if(f.req&&!v){toast(f.l+' is required');$('f_'+f.k).focus();return}if(f.t==='number'&&v!=null&&(isNaN(v)||v<0)){toast('Enter a valid amount');return}o[f.k]=v}onSave(o);closeM()}}
const closeM=()=>$('mo').classList.remove('on');$('mo').onclick=e=>{if(e.target.id==='mo')closeM()};
const FC=[{k:'name',l:'Client name',req:1,w:1},{k:'contact',l:'Contact person'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email',w:1},{k:'notes',l:'Notes',t:'area',w:1}];
const FP=[{k:'name',l:'Business name',req:1,w:1},{k:'contact',l:'Contact person'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'cat',l:'Service category',t:'select',o:['',...CATS]},{k:'services',l:'Services considered',w:1},{k:'value',l:'Potential deal value (R)',t:'number'},{k:'mrr',l:'Expected monthly revenue (R)',t:'number'},{k:'billing',l:'Billing structure',t:'select',o:['',...BILL]},{k:'stage',l:'Pipeline stage',t:'select',o:ST},{k:'close',l:'Expected closing date',t:'date'},{k:'follow',l:'Next follow-up',t:'date'},{k:'notes',l:'Notes',t:'area',w:1}];
const FA=[{k:'name',l:'Service name',req:1,w:1},{k:'cat',l:'Category',t:'select',o:CATS},{k:'billing',l:'Billing',t:'select',o:BILL},{k:'price',l:'Price (R)',t:'number'},{k:'status',l:'Status',t:'select',o:['Active','Paused','Ended']},{k:'start',l:'Start date',t:'date'},{k:'end',l:'End date',t:'date'},{k:'notes',l:'Notes',t:'area',w:1}];
function addClient(){form('New client',FC,{},o=>{S.clients.push({id:uid(),...o,status:'Active',brands:[],agreements:[],added:today()});commit('Client added: '+o.name,'Client added')})}
function editClient(id){const c=S.clients.find(x=>x.id===id);form('Edit client',FC,c,o=>{Object.assign(c,o);commit('Client updated: '+c.name,'Saved')})}
function addProspect(){form('New prospect',FP,{stage:ST[0]},o=>{S.prospects.push({id:uid(),...o,added:today()});commit('Prospect added: '+o.name,'Prospect added');if(page!=='prospects')go('prospects')})}
